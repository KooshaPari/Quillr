name: Lefthook Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lefthook:
    name: Lefthook Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lefthook
        run: |
          curl -sSfL https://raw.githubusercontent.com/evilmartians/lefthook/master/install.sh | sh
          echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Detect languages
        id: detect
        run: |
          echo "has_rust=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_python=$([ -f pyproject.toml ] || [ -f setup.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_node=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        if: steps.detect.outputs.has_rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        if: steps.detect.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        if: steps.detect.outputs.has_node == 'true'
        run: npm ci

      - name: Run pre-commit hooks
        run: lefthook run pre-commit

      - name: Run pre-push hooks
        run: lefthook run pre-push
