name: FR Traceability

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  traceability:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ptrace CLI
        run: |
          mkdir -p ~/bin
          if ! curl -fsL https://raw.githubusercontent.com/phenotype/AgilePlus/main/bin/ptrace -o ~/bin/ptrace; then
            echo "ptrace CLI download failed; skipping traceability validation."
            exit 0
          fi
          chmod +x ~/bin/ptrace
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Check FR Coverage
        run: |
          if command -v ptrace >/dev/null 2>&1; then
            ptrace validate-ai --project .
          else
            echo "ptrace CLI unavailable; traceability validation skipped."
            exit 0
          fi
