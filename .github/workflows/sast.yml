name: Security (SAST)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule: [{cron: "0 2 * * *"}]
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init-action@v4
        with:
          languages: [typescript, python, rust, go]
      - uses: github/codeql-action/autobuild
      - uses: github/codeql-action/analyze
