[project]
name = "Quillr"
version = "0.1.0"
description = "{{ project_description }}"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
description = "Quillr — HTTP-middleware runtime boundary (httpora-core Rust + TS middleware)"
authors = [
    { name = "Koosha Pari", email = "kooshapari@gmail.com" }
]

dependencies = [
    # httpora-core is consumed via workspace path in crates/; no runtime python deps
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.2",
    "pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
